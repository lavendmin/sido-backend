services:
  localdb:
    container_name: sido-db
    image: mysql:8.0
    ports:
      - "3310:3306"
    expose:
      - 3310
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: sidodb
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - ./mysql:/var/lib/mysql

  redis:
    container_name: sido-redis
    image: redis:7
    ports:
      - "6379:6379"
    command: redis-server --notify-keyspace-events Ex
